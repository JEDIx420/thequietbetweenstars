<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
<defs>

      <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#0e142c" />
        <stop offset="45%" stop-color="#070a18" />
        <stop offset="100%" stop-color="#020409" />
      </radialGradient>
      
      <radialGradient id="nebula-cyan" cx="30%" cy="30%" r="50%">
        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
      </radialGradient>

      <radialGradient id="nebula-purple" cx="70%" cy="65%" r="50%">
        <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
      </radialGradient>

      <radialGradient id="nebula-rose" cx="35%" cy="75%" r="45%">
        <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
      </radialGradient>

      <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="50%" stop-color="#a855f7" />
        <stop offset="100%" stop-color="#f43f5e" />
      </linearGradient>

      <linearGradient id="gold-rose" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f43f5e" />
        <stop offset="100%" stop-color="#818cf8" />
      </linearGradient>

      <radialGradient id="singularity-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
        <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
      </radialGradient>

      <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="heavy-glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    
</defs>
